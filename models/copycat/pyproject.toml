[project]
name = "Copycat"
version = "0.1.0"
description = "A Python re-implementation of Melanie Mitchell's classic model of analogy-making"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipython>=9.11.0",
    "pytest>=9.0.2",
]
