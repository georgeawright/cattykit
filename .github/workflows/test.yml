name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Run Cattykit tests
        working-directory: packages/cattykit
        run: uv run python -m pytest tests/

      - name: Run Cattycam tests
        working-directory: packages/cattycam
        run: uv run python -m pytest tests/

      - name: Run Copycat tests
        working-directory: models/copycat
        run: uv run python -m pytest tests/unit
