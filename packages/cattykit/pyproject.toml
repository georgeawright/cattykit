[project]
name = "cattykit"
version = "0.1.1"
description = "A framework for implementing artificial intelligence models using components from the cognitive models of the Fluid Analogies Research Group"
readme = "README.md"
authors = [{name="George Alexander Wright", email="me@georgeaw.com"}]
license = {file="LICENSE"}
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.4.3",
]
keywords = ["cognitive models", "AI"]

[dependency-groups]
dev = [
    "ipython>=9.11.0",
    "pytest>=9.0.2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
