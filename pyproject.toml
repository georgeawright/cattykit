[tool.pytest.ini_options]
addopts = [
    "--strict-config",
]
pythonpath = ["packages/cattykit"]

[tool.uv.workspace]
members = ["packages/*", "models/copycat"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.1",
]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = [
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
